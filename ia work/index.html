<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21473b">
  <title>Vivero · Lista de plantas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CONTROL DE PRODUCCIÓN</p>
      <h1>Lista de plantas</h1>
    </div>
    <button id="syncButton" class="icon-button" type="button" title="Actualizar ahora" aria-label="Actualizar ahora">↻</button>
  </header>

  <main class="app-shell">
    <section class="entry-panel" aria-labelledby="new-entry-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">NUEVA ENTRADA</p>
          <h2 id="new-entry-title">Añadir planta</h2>
        </div>
        <div class="panel-tools">
          <span class="live-dot" title="Guardado automático"></span>
          <button id="toggleFormButton" class="collapse-button" type="button" aria-expanded="true" aria-controls="plantForm" title="Ocultar formulario">Ocultar formulario</button>
        </div>
      </div>

      <form id="plantForm">
        <label class="field field-wide">
          <span>Planta</span>
          <input id="plantName" name="plantName" type="text" placeholder="Ej. Lavanda angustifolia" required autocomplete="off">
        </label>

        <div class="form-grid">
          <label class="field">
            <span>Maceta</span>
            <select id="pot" name="pot">
              <option value="M8.5">M8.5 · suculentas</option>
              <option value="M10.5">M10.5</option>
              <option value="M12">M12</option>
              <option value="M15">M15</option>
              <option value="M17">M17</option>
              <option value="M19">M19</option>
              <option value="M23">M23</option>
              <option value="TC15">TC15</option>
              <option value="TC20">TC20</option>
              <option value="TC23">TC23</option>
            </select>
          </label>
          <label class="field">
            <span>Invernadero</span>
            <select id="greenhouse" name="greenhouse"></select>
          </label>
        </div>

        <div id="boxControls" class="box-controls">
          <label class="field">
            <span>Cajas</span>
            <div class="stepper">
              <button type="button" data-step="-0.5" aria-label="Restar media caja">−</button>
              <input id="boxes" name="boxes" type="number" min="0.5" step="0.5" value="0.5">
              <button type="button" data-step="0.5" aria-label="Añadir media caja">+</button>
            </div>
          </label>
          <label id="unitsPerBoxField" class="field">
            <span>Plantas por caja</span>
            <select id="unitsPerBox" name="unitsPerBox">
              <option value="15">15</option>
              <option value="12">12</option>
            </select>
          </label>
          <label class="field">
            <span>Cantidad total</span>
            <input id="quantity" name="quantity" type="number" min="1" step="1" value="18" required>
          </label>
        </div>

        <div id="manualQuantity" class="manual-quantity field">
          <span>Cantidad</span>
          <input id="manualQuantityInput" type="number" min="1" step="1" value="1">
        </div>

        <details class="notes-details">
          <summary>+ notas</summary>
          <textarea id="notes" name="notes" rows="2" placeholder="Color, prioridad, ubicación exacta..."></textarea>
        </details>

        <button class="primary-button" type="submit">Añadir a pendientes <span>→</span></button>
      </form>
    </section>

    <section class="list-section" aria-labelledby="list-title">
      <div class="list-header">
        <div>
          <p class="eyebrow">PLAN DE TRABAJO</p>
          <h2 id="list-title">La lista</h2>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Estado de plantas">
        <button class="tab active" data-tab="pending" role="tab" aria-selected="true" type="button">Pendientes <b id="pendingCount">0</b></button>
        <button class="tab" data-tab="done" role="tab" aria-selected="false" type="button">Listas <b id="doneCount">0</b></button>
      </div>
      <div id="listContainer" class="plant-list"></div>
    </section>
  </main>

  <footer class="sync-status"><span id="syncIndicator" class="status-dot"></span><span id="syncStatus">Guardado en este dispositivo</span></footer>
  <script src="app.js"></script>
</body>
</html>
